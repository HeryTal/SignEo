name: Validation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: signeo
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: signeo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U signeo -d signeo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_USER: signeo
      DATABASE_PASSWORD: ci-only-password
      DATABASE_NAME: signeo
      JWT_SECRET: ci-only-secret-never-use-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:api
      - run: npm run test:e2e
      - run: npm run test:integration --workspace api
      - run: npm run build
