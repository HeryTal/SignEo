services:
  postgres:
    image: postgres:17-alpine
    container_name: signeo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-signeo}
      POSTGRES_USER: ${DATABASE_USER:-signeo}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change-this-local-password}
    ports:
      - "${DATABASE_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
